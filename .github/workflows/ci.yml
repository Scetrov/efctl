name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload-artifact only; workflow default remains contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -v ./...

      - name: Unit Tests
        run: go test -v -count=1 -coverprofile=coverage.out ./...

      - name: Generate CycloneDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BOM_PATH: ${{ github.workspace }}/bom.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cyclonedx-gomod"
          archive="$RUNNER_TEMP/cyclonedx-gomod/tool.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v1.12.0/cyclonedx-gomod_1.12.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "004b9f5cc595b797fb5423e2ae4c97bcf0f18c712ed2faee1640b09e5efd6d15  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/cyclonedx-gomod" cyclonedx-gomod
          "$RUNNER_TEMP/cyclonedx-gomod/cyclonedx-gomod" app \
            -json -output-version 1.6 -output "$BOM_PATH" .

      - name: Publish CycloneDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom-v1
          path: bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Integration Tests
        run: go test -v -count=1 -tags integration ./tests/integration/...

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build efctl
        run: go build -trimpath -ldflags="-s -w" -o output/efctl main.go

      - name: Verify Docker
        run: docker info

      - name: E2E Tests
        run: |
          EFCTL_BINARY=${{ github.workspace }}/output/efctl \
          go test -v -count=1 -tags e2e -timeout 15m ./tests/e2e/...
        env:
          CI: "true"
          DOCKER_HOST: unix:///var/run/docker.sock
          EFCTL_ENGINE: docker


