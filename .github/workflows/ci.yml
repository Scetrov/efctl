name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -v ./...

      - name: Unit Tests
        run: go test -v -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration Tests
        run: go test -v -count=1 -tags integration ./tests/integration/...

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build efctl
        run: go build -trimpath -ldflags="-s -w" -o output/efctl main.go

      - name: Verify Docker
        run: docker info

      - name: E2E Tests
        run: |
          EFCTL_BINARY=${{ github.workspace }}/output/efctl \
          go test -v -count=1 -tags e2e -timeout 30m ./tests/e2e/...
        env:
          CI: "true"
          DOCKER_HOST: unix:///var/run/docker.sock
          EFCTL_ENGINE: docker

  workflow-lint:
    name: Workflow linting (actionlint + pinning gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action SHA pinning
        run: bash scripts/check-action-pinning.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Generate SARIF report
        if: always()
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -format "$(cat scripts/actionlint-sarif-template.txt)" \
            .github/workflows/*.yml > actionlint.sarif || true

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: actionlint.sarif
          category: workflow-lint

      - name: Remove SARIF from workspace
        if: always()
        run: rm -f actionlint.sarif


