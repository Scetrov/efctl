name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload-artifact only; workflow default remains contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -v ./...

      - name: Unit Tests
        run: go test -v -count=1 -coverprofile=coverage.out ./...

      - name: Generate CycloneDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BOM_PATH: ${{ github.workspace }}/bom.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cyclonedx-gomod"
          archive="$RUNNER_TEMP/cyclonedx-gomod/tool.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v1.12.0/cyclonedx-gomod_1.12.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "004b9f5cc595b797fb5423e2ae4c97bcf0f18c712ed2faee1640b09e5efd6d15  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/cyclonedx-gomod" cyclonedx-gomod
          "$RUNNER_TEMP/cyclonedx-gomod/cyclonedx-gomod" app \
            -json -output-version 1.6 -output "$BOM_PATH" .

      - name: Publish CycloneDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom-v1
          path: bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration Tests
        run: go test -v -count=1 -tags integration ./tests/integration/...

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify Docker
        run: docker info

      - name: E2E Tests
        run: make test-e2e E2E_TIMEOUT=30m
        env:
          CI: "true"
          DOCKER_HOST: unix:///var/run/docker.sock
          EFCTL_ENGINE: docker

  workflow-lint:
    name: Workflow linting (actionlint + pinning gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action SHA pinning
        run: bash scripts/check-action-pinning.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Generate SARIF report
        if: always()
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -format "$(cat scripts/actionlint-sarif-template.txt)" \
            .github/workflows/*.yml > actionlint.sarif || true

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: actionlint.sarif
          category: workflow-lint

      - name: Remove SARIF from workspace
        if: always()
        run: rm -f actionlint.sarif


